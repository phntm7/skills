interface:
  display_name: "Deep Code Review"
  short_description: "In-depth, dynamically routed PR/change-set/codebase review with verified findings"
  default_prompt: "Use $deep-code-review to run a rigorous review of a PR, branch, or codebase — it routes checks (correctness, architecture, simplicity, naming, tests, security, performance, AI-slop, adversarial) by risk profile, verifies Blocker/Major findings before reporting, and returns prioritized, PR-comment-ready findings with a verdict."
