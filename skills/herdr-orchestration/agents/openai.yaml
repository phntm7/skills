interface:
  display_name: "Herdr Orchestration"
  short_description: "Orchestrate issues via claude/codex implementers in herdr worktree workspaces, with opposite-family review to PR approval and merge."
  default_prompt: "Use $herdr-orchestration to implement a folder of issues: create a herdr worktree workspace per issue, launch a claude or codex implementer, review with the opposite model family, loop fix and re-review to LGTM, respect subscription headroom via cclimits, then squash-merge and clean up."
